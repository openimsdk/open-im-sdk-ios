name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Swift Tests & Pod Lint
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Run SPM Unit Tests
        run: swift test

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Lint Podspec
        run: pod lib lint OpenIMSDK.podspec --allow-warnings --skip-tests
